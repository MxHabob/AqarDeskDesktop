name: AqarDesk Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      workflow_sha: ${{ steps.validate.outputs.workflow_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag, versions, and notes
        id: validate
        env:
          TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git fetch origin main --tags --force
          echo "workflow_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          node scripts/validate-release.mjs

  build:
    name: Build (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: macos
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Checkout validated release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: release-tooling
          sparse-checkout: |
            scripts/create-tauri-updater-manifest.mjs
            scripts/merge-release-artifacts.mjs
            scripts/prepare-tauri-updater-config.mjs
            scripts/stage-release-artifacts.mjs
            scripts/upload-updater-to-r2.mjs
            scripts/validate-license-build-config.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: aqardesk-tauri-${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Prepare updater public-key configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_UPDATER_PUBLIC_URL: ${{ vars.TAURI_UPDATER_PUBLIC_URL }}
          TAURI_UPDATER_PATH_PREFIX: aqardesk
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_CONFIG_PATH: apps/desktop/src-tauri/target/tauri-updater-release.conf.json
        run: |
          node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error('Set the TAURI_SIGNING_PRIVATE_KEY repository secret before creating a release.')"
          node release-tooling/scripts/prepare-tauri-updater-config.mjs

      - name: Validate Mulverse license configuration
        env:
          MULVERSE_LICENSE_API_BASE_URL: ${{ vars.MULVERSE_LICENSE_API_BASE_URL }}
          MULVERSE_LICENSE_PRODUCT_CODE: ${{ vars.MULVERSE_LICENSE_PRODUCT_CODE }}
          MULVERSE_LICENSE_PRODUCT_ID: ${{ vars.MULVERSE_LICENSE_PRODUCT_ID }}
          MULVERSE_LICENSE_KEY_PREFIX: ${{ vars.MULVERSE_LICENSE_KEY_PREFIX }}
          MULVERSE_LICENSE_PUBLIC_KEY_ID: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_ID }}
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
        run: node release-tooling/scripts/validate-license-build-config.mjs

      - name: Build signed desktop bundle
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_URL: ${{ vars.TAURI_UPDATER_PUBLIC_URL }}
          TAURI_UPDATER_PATH_PREFIX: aqardesk
          MULVERSE_LICENSE_API_BASE_URL: ${{ vars.MULVERSE_LICENSE_API_BASE_URL }}
          MULVERSE_LICENSE_PRODUCT_CODE: ${{ vars.MULVERSE_LICENSE_PRODUCT_CODE }}
          MULVERSE_LICENSE_PRODUCT_ID: ${{ vars.MULVERSE_LICENSE_PRODUCT_ID }}
          MULVERSE_LICENSE_KEY_PREFIX: ${{ vars.MULVERSE_LICENSE_KEY_PREFIX }}
          MULVERSE_LICENSE_PUBLIC_KEY_ID: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_ID }}
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
        run: bun run tauri:build -- --config src-tauri/target/tauri-updater-release.conf.json --target ${{ matrix.target }}

      - name: Stage updater bundle and signature
        env:
          TAURI_TARGET: ${{ matrix.target }}
          TAURI_BUNDLE: ${{ matrix.bundle }}
        run: node release-tooling/scripts/stage-release-artifacts.mjs

      - name: Create updater metadata
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TAURI_UPDATER_PUBLIC_URL: ${{ vars.TAURI_UPDATER_PUBLIC_URL }}
          TAURI_UPDATER_PATH_PREFIX: aqardesk
          TAURI_TARGET: ${{ matrix.target }}
        run: node release-tooling/scripts/create-tauri-updater-manifest.mjs

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ needs.validate.outputs.version }}
          path: ci-artifacts/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Checkout validated release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.workflow_sha }}
          path: release-tooling
          sparse-checkout: |
            scripts/merge-release-artifacts.mjs
            scripts/prepare-tauri-updater-config.mjs
            scripts/upload-updater-to-r2.mjs
          sparse-checkout-cone-mode: false

      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Validate and merge updater metadata
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TAURI_UPDATER_PUBLIC_URL: ${{ vars.TAURI_UPDATER_PUBLIC_URL }}
          TAURI_UPDATER_PATH_PREFIX: aqardesk
        run: node release-tooling/scripts/merge-release-artifacts.mjs

      - name: Upload updater to Cloudflare R2
        env:
          TAURI_UPDATER_PUBLIC_URL: ${{ vars.TAURI_UPDATER_PUBLIC_URL }}
          TAURI_UPDATER_PATH_PREFIX: aqardesk
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          aws --version
          node release-tooling/scripts/upload-updater-to-r2.mjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: AqarDesk Desktop ${{ needs.validate.outputs.tag }}
          body_path: releases/${{ needs.validate.outputs.tag }}.md
          draft: false
          prerelease: false
          files: release-package/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
