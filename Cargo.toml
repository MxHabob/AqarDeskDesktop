[workspace]
members = [
  "backend/crates/domain",
  "backend/crates/app",
  "backend/crates/infrastructure",
  "backend/api",
  "backend/worker",
  "apps/desktop/src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
aqardesk-domain = { path = "backend/crates/domain" }
aqardesk-app = { path = "backend/crates/app" }
aqardesk-infrastructure = { path = "backend/crates/infrastructure" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
axum = "0.8"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service", "windows-native"] }
url = "2"
reqwest = { version = "0.13", features = ["json"] }

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
