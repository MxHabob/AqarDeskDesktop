[workspace]
members = [
  "backend",
  "apps/desktop/src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-rust_decimal"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "sync-secret-service", "windows-native"] }
url = "2"
reqwest = { version = "0.13", features = ["json"] }
async-trait = "0.1"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = "thin"
